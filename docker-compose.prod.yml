services:
  backend:
    image: 688525135605.dkr.ecr.ap-south-1.amazonaws.com/rag-backend:latest
    ports:
      - "5000:5000"
    networks:
      - app-network
    environment:
      PORT: ${PORT}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_KEY: ${QDRANT_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    restart: always

  frontend:
    image: 688525135605.dkr.ecr.ap-south-1.amazonaws.com/rag-frontend:latest
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      REACT_APP_SUPABASE_URL: ${REACT_APP_SUPABASE_URL}
      REACT_APP_SUPABASE_ANON_KEY: ${REACT_APP_SUPABASE_ANON_KEY}
    depends_on:
      - backend
    restart: always

networks:
  app-network: